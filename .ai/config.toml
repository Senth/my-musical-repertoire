# What this repo considers proof, and how to boot it.
# The stage logic lives in the global agents; this file and `docs/` are all the repo carries.

[gates]
# Ordered, cheapest first. Every one runs, every time.
# `lint --write` fixes what it can, so it goes first and the rest see formatted
# source. The e2e command boots the stack itself: `dev-stack.sh up` is idempotent
# and reuses a stack that is already running.
commands = [
  "yarn lint --write",
  "yarn invariants",
  "yarn typecheck",
  "yarn test",
  "scripts/dev-stack.sh up && yarn e2e",
]

[review]
# Globs that make a change user-visible, and whether this repo has a browser stage.
#
# These are the paths where a player or a teacher could notice. They are the floor,
# not the verdict: the reviewer reads the diff and answers `User-visible: yes | no`,
# and a scoring change under `utils/` or `models/` that alters which section gets
# suggested is user-visible even though no glob here matches it. A new component
# nothing routes to yet is not.
visible_paths = [
  "app/**",
  "components/**",
  "contexts/**",
  "hooks/**",
  "theme/**",
  "i18n/locales/**",
  "assets/**",
  "public/**",
]
browser = true

[dev]
# How a browser review brings the app up. Nothing else boots anything.
#
# Ports are per checkout, not per worktree pool: the emulators come from
# `firebase.json` and are shared, the web server is 8055 in the main checkout and
# 8056 in a worktree. `ports` prints the one for the checkout you are in, and `up`
# prints `WEB_URL=` on its last line. Never assume 8055.
start = "scripts/dev-stack.sh up"
url = "http://localhost:$(scripts/dev-stack.sh ports)"
# Sign-in is an **email and password form** against the Auth emulator, not a
# redirect: type pianist@example.com / practice123, then "Sign in with Email".
# The account and the readiness marker are a contract with the e2e seed, and
# they live in `e2e/support/app.ts`. `.tmp/e2e/auth.json` does not shortcut
# this: it is a Playwright storage state including IndexedDB, and `state-load`
# restores cookies and `localStorage` only.
auth = "type pianist@example.com / practice123 -> click 'Sign in with Email'"
ready = "Suggested Practices"

# What the e2e seed writes, so an empty screen is judged and not reported.
# There is no committed fixture export: `e2e/seed.setup.ts` runs as the first
# Playwright project of every `yarn e2e` and writes the fixture through the
# app's own Firebase shapes, with dates computed at run time. It holds one
# account — pianist@example.com — four pieces and three techniques. Invention
# No. 1 has Exposition LH/RH/HT two days ago, Middle entries HT yesterday and
# a run-through today flagging Middle entries. Its stabilizing state earns
# no run-through section credits. The Active C major scale enables staccato,
# has clean HT saves three and two days ago and one save yesterday with plain
# LH/RH and staccato LH/RH: three clean days, so its detail screen shows the
# curriculum card offering the Not started G major scale (#20). Hanon No. 1 is
# Maintenance. Practice logs have no notes. Nocturne, Für Elise, Gymnopédie,
# Hanon and G major remain never practised; empty history on those is
# intentional, not data loss.

[design]
# The contract and the values it is written against. `theme/tokens.ts` is ground
# truth: when the contract and the file disagree, the file is right and the contract
# is stale. Nobody edits the contract mid-run — a finding cites a rule in it or is
# flagged a taste call, and proposed rule changes go to the human as one diff.
# Personal repo: the product-specific taste lives in `docs/DESIGN.md` sections, not
# in a repo design skill.
#
# `theme/tokens.ts` does not exist yet. It arrives with #127, which converts the
# app's NativeWind classes onto it; until then the contract is what holds, and a
# new style prop is written against the scale the contract names.
contract = "docs/DESIGN.md"
tokens = "theme/tokens.ts"
