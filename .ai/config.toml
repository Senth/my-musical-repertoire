# What this repo considers proof, and where its stage logic lives.
# Written by `aic init`; the rest is my-musical-repertoire's own.

[gates]
# Ordered, cheapest first. Every one runs, every time.
# `lint --write` fixes what it can, so it goes first and the rest see formatted
# source. The e2e command boots the stack itself: `dev-stack.sh up` is idempotent
# and reuses a stack that is already running.
commands = [
  "yarn lint --write",
  "yarn invariants",
  "yarn typecheck",
  "yarn test",
  "scripts/dev-stack.sh up && yarn e2e",
]

[review]
# Globs that make a change user-visible, and whether this repo has a browser stage.
#
# These are the paths where a player or a teacher could notice. They are the floor,
# not the verdict: `diff-review` reads the diff and answers `User-visible: yes | no`,
# and a scoring change under `utils/` or `models/` that alters which section gets
# suggested is user-visible even though no glob here matches it. A new component
# nothing routes to yet is not.
visible_paths = [
  "app/**",
  "components/**",
  "contexts/**",
  "hooks/**",
  "theme/**",
  "i18n/locales/**",
  "assets/**",
  "public/**",
]
browser = true

[design]
# The contract and the values it is written against. The token source is ground
# truth: when the contract and the file disagree, the file is right and the
# contract is stale. Nobody edits the contract mid-run — a finding cites a rule in
# it or is flagged a taste call, and proposed rule changes go to the human as one
# diff.
#
# Both files arrive after this one: `docs/DESIGN.md` is written before the refactor
# that has to conform to it, and `theme/tokens.ts` is what that refactor converts
# the app's NativeWind classes onto.
contract = "docs/DESIGN.md"
tokens = "theme/tokens.ts"

[stages]
implement = "implement"
review = "review"
ship = "ship"

[paths]
specs = "docs/specs"
dispatch = ".tmp/dispatch"
prompts = ".tmp/prompts"
checkpoint = ".tmp/continue-work.state.json"
