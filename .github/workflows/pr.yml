name: PR - Lint and build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # The Firestore and Auth emulators are JVM processes.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # The emulator jars are ~100MB and are downloaded on first use.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators

      - name: Yarn install
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Lint
        uses: borales/actions-yarn@v5
        with:
          cmd: lint

      - name: Invariants
        uses: borales/actions-yarn@v5
        with:
          cmd: invariants

      - name: Test
        uses: borales/actions-yarn@v5
        with:
          cmd: test --watchAll=false

      - name: Export environment variables
        run: echo "${{ secrets.ENV }}" > .env.local

      - name: Build web
        uses: borales/actions-yarn@v5
        with:
          cmd: build:web

      # After the build, not before: `expo-env.d.ts` is generated by the Expo
      # CLI and gitignored, and without it every `import "./global.css"` is an
      # unresolved module.
      - name: Typecheck
        uses: borales/actions-yarn@v5
        with:
          cmd: typecheck

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      # Boots the emulator suite from the committed fixture plus an
      # emulator-backed web server, the same stack `/review` runs against.
      - name: Start the e2e stack
        run: scripts/dev-stack.sh up

      - name: e2e
        run: yarn e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .tmp/e2e/report
          retention-days: 7

      - name: Stop the e2e stack
        if: always()
        run: scripts/dev-stack.sh down
