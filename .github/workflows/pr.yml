name: PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PR gates
    runs-on: ubuntu-latest
    steps:
      # Full history: `yarn invariants --base` diffs against the PR's base
      # branch, and a shallow single-branch checkout has no base commit to
      # diff against — which the script treats as a hard error, not a pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x

      # The Firestore and Auth emulators are JVM processes.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}

      # The emulator jars are ~100MB and are downloaded on first use.
      - name: Cache Firebase emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators

      - name: Yarn install
        uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5
        with:
          cmd: install

      - name: Lint
        uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5
        with:
          cmd: lint

      # `--base` is explicit: an unresolvable named base is a hard error in the
      # script, so a CI expression that evaluated to an empty string can never
      # read as a pass.
      - name: Invariants
        run: yarn invariants --base origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Typecheck
        uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5
        with:
          cmd: typecheck

      - name: Test
        uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5
        with:
          cmd: test --watchAll=false

      - name: Export environment variables
        run: echo "${{ secrets.ENV }}" > .env.local

      - name: Build web
        uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5
        with:
          cmd: build:web


      # The Chromium download is ~150MB. Keyed on the Playwright version, so a
      # bump invalidates it and nothing else does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      # Boots the emulator suite and emulator-backed web server; e2e seeds its
      # fixture at run time, the same stack the review runs against.
      - name: Start the e2e stack
        run: scripts/dev-stack.sh up

      - name: e2e
        run: yarn e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: .tmp/e2e/report
          retention-days: 7

      - name: Stop the e2e stack
        if: always()
        run: scripts/dev-stack.sh down
