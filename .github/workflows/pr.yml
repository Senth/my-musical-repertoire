name: PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PR gates
    runs-on: ubuntu-latest
    steps:
      # Full history: `yarn invariants --base` diffs against the PR's base
      # branch, and a shallow single-branch checkout has no base commit to
      # diff against — which the script treats as a hard error, not a pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # The Firestore and Auth emulators are JVM processes.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # The emulator jars are ~100MB and are downloaded on first use.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators

      - name: Yarn install
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Lint
        uses: borales/actions-yarn@v5
        with:
          cmd: lint

      # `--base` is explicit: an unresolvable named base is a hard error in the
      # script, so a CI expression that evaluated to an empty string can never
      # read as a pass.
      - name: Invariants
        run: yarn invariants --base origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Typecheck
        uses: borales/actions-yarn@v5
        with:
          cmd: typecheck

      - name: Test
        uses: borales/actions-yarn@v5
        with:
          cmd: test --watchAll=false

      - name: Export environment variables
        run: echo "${{ secrets.ENV }}" > .env.local

      - name: Build web
        uses: borales/actions-yarn@v5
        with:
          cmd: build:web


      # The Chromium download is ~150MB. Keyed on the Playwright version, so a
      # bump invalidates it and nothing else does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      # Boots the emulator suite from the committed fixture plus an
      # emulator-backed web server, the same stack `/review` runs against.
      - name: Start the e2e stack
        run: scripts/dev-stack.sh up

      - name: e2e
        run: yarn e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .tmp/e2e/report
          retention-days: 7

      - name: Stop the e2e stack
        if: always()
        run: scripts/dev-stack.sh down
