name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Pin exact patch: firebase 13 declares engines node >= 24.12.0, and
          # the runner toolcache may serve an older 24.x whose install then
          # fails the same way. Do not loosen to 24.x.
          node-version: 24.15.0

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Yarn install
        uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5
        with:
          cmd: install

      - name: Export environment variables
        run: |
          echo "${{ secrets.ENV }}" > .env.local
          echo "EXPO_PUBLIC_BUILD=\"$(date -u +%Y-%m-%d) · $(git rev-parse --short HEAD)\"" >> .env.local

      - name: Build web
        uses: borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5
        with:
          cmd: build:web

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: my-musical-repertoire
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/my-musical-repertoire
          service_account: github-actions-deploy@my-musical-repertoire.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Deploy to Firebase
        # firebase-tools authenticates via Application Default Credentials, i.e.
        # the external_account file the auth step writes and points
        # GOOGLE_APPLICATION_CREDENTIALS at. It does NOT read
        # GOOGLE_OAUTH_ACCESS_TOKEN, so no token env var is needed here.
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --project my-musical-repertoire

